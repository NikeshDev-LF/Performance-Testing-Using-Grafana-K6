name: Soak Test

on:
  push:
    branches:
      - soak-test
  workflow_dispatch:
  schedule:
    - cron: '15 18 * * 0' # Run weekly on Monday at 12 AM NPT (GMT+5:45)

jobs:
  soak-test:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reduce soak test duration for CI
        run: |
          sed -i "s/{ duration: '4h', target: 30 }/{ duration: '30m', target: 30 }/" k6/soak.test.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Start application
        run: |
          node sample-app/server.js &
          sleep 5
          curl http://localhost:3000/api/health

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run k6 soak test
        run: k6 run k6/soak.test.js
        continue-on-error: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-test-html-report
          path: reports/soak/soak-test-report.html

      - name: Generate summary
        if: always()
        run: |
          echo "## ⏱️ Soak Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the HTML report artifact to view detailed results." >> $GITHUB_STEP_SUMMARY
          echo "This test identifies memory leaks and performance degradation over time." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ Note: CI runs use reduced duration (30m instead of 4h)" >> $GITHUB_STEP_SUMMARY
