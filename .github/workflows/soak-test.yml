name: Soak Test

on:
  push:
    branches:
      - soak-test
  workflow_dispatch:
  schedule:
    - cron: '15 18 * * 0' # Run weekly on Monday at 12 AM NPT (GMT+5:45)

jobs:
  soak-test:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # 5 hours for long-running soak test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reduce soak test duration for CI
        run: |
          # Modify soak test to run for 30 minutes in CI instead of 4 hours
          sed -i "s/{ duration: '4h', target: 30 }/{ duration: '30m', target: 30 }/" k6/soak-test.js

      - name: Create Docker network
        run: docker network create k6-test-network

      - name: Build and start application
        run: |
          docker build -t sample-app -f - . <<EOF
          FROM node:22-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --only=production
          COPY . .
          EXPOSE 3000
          CMD ["node", "sample-app/server.js"]
          EOF
          docker run -d --name app --network k6-test-network -p 3000:3000 sample-app

      - name: Wait for application to be ready
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:3000/api/health; do sleep 2; done'

      - name: Run k6 soak test
        run: |
          docker run --rm --network k6-test-network \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            grafana/k6:latest run \
            --out json=k6/soak-test-results.json \
            k6/soak.test.js
        env:
          K6_BASE_URL: http://app:3000

      - name: Stop and remove containers
        if: always()
        run: |
          docker stop app || true
          docker rm app || true
          docker network rm k6-test-network || true

      - name: Setup Node.js for report generation
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies for reporting
        if: always()
        run: npm ci

      - name: Generate HTML report
        if: always()
        run: node scripts/generate-html-report.js k6/soak-test-results.json k6/soak-test-results.html "Soak Test"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-test-html-report
          path: k6/soak-test-results.html

      - name: Generate summary
        if: always()
        run: |
          echo "## ⏱️ Soak Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the HTML report artifact to view detailed results." >> $GITHUB_STEP_SUMMARY
          echo "This test identifies memory leaks and performance degradation over time." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ Note: CI runs use reduced duration (30m instead of 4h)" >> $GITHUB_STEP_SUMMARY
