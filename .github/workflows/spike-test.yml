name: Spike Test

on:
  push:
    branches:
      - spike-test
  workflow_dispatch:
  schedule:
    - cron: '15 18 * * 0' # Run weekly on Monday at 12 AM NPT (GMT+5:45)

jobs:
  spike-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Start application
        run: |
          node sample-app/server.js &
          sleep 5
          curl http://localhost:3000/api/health

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run k6 spike test
        run: k6 run k6/spike.test.js
        continue-on-error: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-test-html-report
          path: reports/spike/spike-test-report.html

      - name: Generate summary
        if: always()
        run: |
          echo "## ⚡ Spike Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the HTML report artifact to view detailed results." >> $GITHUB_STEP_SUMMARY
          echo "This validates system behavior during flash sales or viral events." >> $GITHUB_STEP_SUMMARY
